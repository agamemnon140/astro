name: Checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: node --check app.js && node --check ui.js && node --check astronomy.js && node --check charts.js && node --check sw.js
      - run: npm run test:browser
